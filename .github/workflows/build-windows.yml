# Сборка Qt6-приложения math100_generator для Windows 11 x64 на GitHub Actions.
# Итог — zip-артефакт с exe + Qt-зависимостями (включая QtWebEngine, ~400–700 МБ).
name: Build Windows (Win11 x64)

on:
  push:
    branches: [main, master]
  workflow_dispatch: # позволяет запускать сборку вручную из UI GitHub

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # 1. Выкачиваем исходники репозитория.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Ставим aqtinstall — инструмент для установки официального Qt на раннер.
      - name: Install aqtinstall
        run: pip install aqtinstall

      # 3. Установка Qt + модуль QtWebEngine в C:\qt (качаем с download.qt.io —
      #    с раннеров GitHub это доступно).
      #    ВАЖНО: версию НЕ пишем жёстко — онлайн-репозиторий Qt периодически
      #    убирает старые версии (6.8.2 исчез из него, и aqt упал с ошибкой
      #    "packages not found"). Поэтому спрашиваем aqt, что реально доступно
      #    ПРЯМО СЕЙЧАС, и берём старшую 6.x с msvc-архитектурой (фолбэк — 7.x).
      #    В нашем коде только стабильные Qt6 API (WebEngine/Network/Widgets),
      #    поэтому любая 6.x с WebEngine подходит.
      - name: Install latest available Qt 6.x + WebEngine
        id: qtinstall
        shell: powershell
        run: |
          # IMPORTANT (lessons from runs 35433391113 / 35434068943):
          # 1) The runner uses WindowsPowerShell 5.1 and GitHub Actions sets
          #    $ErrorActionPreference=Stop - ANY stderr from a native command
          #    (aqt logs to stderr) becomes a terminating error and kills the
          #    step, even with 2>$null. Therefore ALL aqt calls below are
          #    wrapped in cmd /c (stderr merged into output, no killing).
          # 2) Version is NOT hard-coded: the Qt online repo drops old versions
          #    (6.8.2 disappeared -> aqt "packages not found"), and metadata of
          #    the newest versions is sometimes broken ("Failed to download
          #    checksum"). We probe versions one by one (newest first) and take
          #    the first one exposing an msvc architecture (6.x preferred, then 7.x).
          # 3) ALL strings below are ASCII on purpose: WindowsPowerShell 5.1
          #    reads generated .ps1 as ANSI (no BOM) and any non-ASCII byte
          #    breaks the parser (run 35434251583: "string is missing the terminator").
          $versRaw = cmd /c "aqt list-qt windows desktop 2>&1" | Out-String
          $vers = $versRaw -split '\s+' |
                  Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
                  Sort-Object { [version]$_ } -Unique -Descending
          Write-Host "Available versions: $($vers -join ', ')"
          $cands = @()
          foreach ($v in $vers) {
            $major = [int]([regex]::Match($v, '^(\d+)\.').Groups[1].Value)
            if ($major -lt 6) { continue }
            $arches = cmd /c "aqt list-qt windows desktop --arch $v 2>&1" | Out-String
            $arch = $null
            if ($arches -match 'win64_msvc2019_64') { $arch = 'win64_msvc2019_64' }
            elseif ($arches -match 'win64_msvc2022_64') { $arch = 'win64_msvc2022_64' }
            if ($arch) {
              $cands += [pscustomobject]@{ Ver = $v; Arch = $arch }
              Write-Host "Candidate: $v / $arch"
            } else {
              $short = $arches.Trim()
              if ($short.Length -gt 300) { $short = $short.Substring(0, 300) }
              Write-Host "Skip $v (no msvc arch). aqt said: $short"
            }
            if ($cands.Count -ge 5) { break }  # max 5 probes
          }
          if ($cands.Count -eq 0) {
            Write-Host "No suitable Qt (>=6, msvc) found in the online repo. aqt list-qt said:"
            Write-Host $versRaw
            exit 1
          }
          $pick = @($cands | Where-Object { $_.Ver -like '6.*' }) | Select-Object -First 1
          if (-not $pick) { $pick = $cands[0]; Write-Host "WARNING: no 6.x available, taking $($pick.Ver)" }
          Write-Host "=== Installing Qt $($pick.Ver) / $($pick.Arch) + qtwebengine ==="
          # Modules: qtwebengine always + qtwebchannel IF it exists as a
          # separate module for this version (aqt syntax: space-separated args
          # after -m; a comma is parsed as part of one package name - run
          # 35435056529). WebChannel is NOT pulled automatically (CMake fails
          # on Qt6WebChannel_DIR - run 35434724672).
          $modRaw = cmd /c "aqt list-qt windows desktop --modules $($pick.Ver) $($pick.Arch) 2>&1" | Out-String
          Write-Host "Modules for $($pick.Ver): $($modRaw.Trim())"
          # aqt pulls only its known auto-deps; Qt6WebEngineCore additionally
          # needs Qt6WebChannel and Qt6Positioning (module "qtlocation") -
          # both NOT auto-pulled (runs 35434724672, 35435830708). Add them if
          # present for this version.
          $mods = @('qtwebengine')
          foreach ($extra in @('qtwebchannel', 'qtlocation')) {
            if ($modRaw -match [regex]::Escape($extra)) {
              $mods += $extra
              Write-Host "Adding module: $extra"
            } else {
              Write-Host "WARNING: $extra not in the module list"
            }
          }
          $installLog = cmd /c "aqt install-qt windows desktop $($pick.Ver) $($pick.Arch) -O C:\qt -m $($mods -join ' ') 2>&1" | Out-String
          Write-Host $installLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # aqt lays out the install as C:\qt\<version>\<arch without "win64_" prefix>.
          # CMake and windeployqt need the real root - export it for later steps.
          $qtSub = $pick.Arch -replace '^win64_', ''
          $qtRoot = "C:\qt\$($pick.Ver)\$qtSub"
          Write-Host "Qt root: $qtRoot"
          Add-Content $env:GITHUB_OUTPUT "qt_root=$qtRoot"
          exit 0

      # 4. Конфигурируем CMake.
      #    ВАЖНО (опыт рана 35434493236): НЕ использовать -G Ninja — на раннере
      #    в PATH стоит MinGW g++ (C:/mingw64), и Ninja-генератор брал его вместо
      #    MSVC, хотя Qt стоит MSVC-сборка. Генератор Visual Studio 2022 (по
      #    умолчанию на раннере) гарантирует cl.exe. Qt путь — ДИНАМИЧЕСКИЙ:
      #    aqt кладёт всё в C:\qt\<версия>\<арх>\, его выдал шаг qtinstall.
      - name: Configure CMake
        run: cmake -B build -DCMAKE_PREFIX_PATH=${{ steps.qtinstall.outputs.qt_root }}

      # 5. Собираем все цели (math100_generator и mathsplit_test).
      #    Multi-config генератор: конфигурация задаётся --config Release.
      - name: Build
        run: cmake --build build --config Release --parallel

      # 6. Запускаем unit-тест mathsplit_test.
      #    Тест ищет фикстуры по относительному пути ../tests/testdata/mathsplit_cases.txt,
      #    поэтому cwd = build. Успех = exit 0 и сообщение "ALL PASS".
      - name: Run unit tests (mathsplit_test)
        working-directory: build
        run: Release\mathsplit_test.exe

      # 7. Деплой Qt-зависимостей рядом с exe (windeployqt из C:\qt\bin).
      #    --compiler-runtime: копирует MSVC-рантайм, пользователю не нужен VC++ Redistributable.
      #    --no-translations: переводы Qt не нужны, экономит ~50 МБ.
      #    dist\cache приложение создаёт само при старте — создавать его здесь не нужно.
      #    WebEngine (QtWebEngineProcess.exe + ресурсы Chromium) копируется windeployqt автоматически.
      - name: Deploy Qt dependencies (windeployqt)
        shell: powershell
        run: |
          # ASCII-only (PS 5.1 / ANSI .ps1 - см. шаг qtinstall).
          # exe лежит в build\Release\ (multi-config генератор).
          New-Item -ItemType Directory -Force dist
          Copy-Item build\Release\math100_generator.exe dist\
          & "${{ steps.qtinstall.outputs.qt_root }}\bin\windeployqt.exe" --compiler-runtime --no-translations dist\math100_generator.exe
          exit $LASTEXITCODE

      # 8. Архивируем готовую папку dist в zip.
      - name: Create zip archive
        run: Compress-Archive -Path dist -DestinationPath math100_generator_win64.zip

      # 9. Загружаем zip как артефакт (хранение 7 дней).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: math100_generator_win64
          path: math100_generator_win64.zip
          retention-in-days: 7
